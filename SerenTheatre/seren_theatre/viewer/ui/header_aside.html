<!-- Right-side header widgets, filled by scripts.js. .head-pill is the shared
     baseplate widget style.

     #runs-pill replaced a "1 stage" counter that told you nothing you could act
     on: you configured the stages, so you already know how many there are. What
     you cannot know without looking is how many RUNS are on disk and whether
     any of them is moving right now. A pill should answer a question you
     actually have. -->
<span class="head-pill" id="rehearsal-pill" style="display:none"
      title="every number on this page is fabricated">⚠ REHEARSAL</span>
<span class="head-pill" id="runs-pill" title="runs found across every watched stage">-</span>
<span class="head-pill" id="age-pill" title="how fresh this reading is">-</span>
<button onclick="reload()" title="Reload">⟳</button>
