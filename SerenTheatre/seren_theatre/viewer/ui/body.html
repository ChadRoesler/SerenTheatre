<!-- Two .view panels the shell's showTab() toggles.

     #rehearsal-banner is the loud twin of the header pill; #error-slot carries
     connect errors. Everything else is painted by scripts.js from /api/state. -->
<div id="rehearsal-banner" class="rehearsal" style="display:none">
    ⚠ <b>REHEARSAL</b> — every number below is fabricated. Nothing here is a reading.
</div>
<div id="error-slot"></div>

<section class="view" id="stages">
    <!-- An empty room is a TRUE reading, not an error, and it gets said in
         words rather than left as a blank panel that looks like a failure. -->
    <div id="stages-body"></div>
</section>

<section class="view" id="logs">
    <div class="toolbar">
        <span class="hint" id="logs-hint">run logs · newest first · tail only</span>
        <div class="spacer"></div>
    </div>
    <div id="logs-body"></div>
</section>

<section class="view" id="surgeries">
    <div class="toolbar">
        <span class="hint" id="arc-where">archive</span>
        <div class="spacer"></div>
        <!-- Tick two runs and this lights up. The archive is a filing cabinet
             until you can put two runs beside each other; this is the button
             that makes it an instrument. -->
        <span class="hint" id="cmp-status"></span>
        <button id="cmp-go" disabled>Compare</button>
        <button id="arc-reload" title="re-read the archive">Refresh</button>
    </div>
    <div id="cmp-body"></div>
    <div id="arc-body"></div>
</section>

<section class="view" id="repertoire">
    <div class="toolbar">
        <span class="hint" id="rep-where">prompt books</span>
        <div class="spacer"></div>
        <!-- A plain file input, not a drop zone: this has to work over an SSH
             tunnel on a headless box, same reason the recipe editor is a
             textarea and Starwright is a TUI. -->
        <input type="file" id="rep-file" accept=".zip" hidden>
        <button id="rep-import">Import a bundle…</button>
        <button id="rep-reload" title="re-read the shelf">Refresh</button>
    </div>
    <div id="rep-out"></div>
    <div id="rep-body"></div>
</section>

<section class="view" id="backstage">
    <div class="toolbar">
        <span class="hint" id="bs-where">recipes</span>
        <div class="spacer"></div>
        <!-- THIS PANEL DOES NOT POLL. loadBackstage runs once at page import,
             so a recipe saved in another window, an ms-moe-maker upgraded on
             the box, or a registry yaml dropped in ~/.msmoe never appeared
             until a hard refresh - which reads as "backstage stopped working"
             rather than as "this panel is a snapshot". Polling it would fork
             `describe` every five seconds forever; a button costs one click
             and never surprises anyone. -->
        <button id="bs-reload" title="re-read the recipe list and re-ask the box">Refresh</button>
        <select id="bs-list"><option value="">— new recipe —</option></select>
        <input id="bs-name" placeholder="name" size="16">
        <button id="bs-validate">Validate</button>
        <button id="bs-save">Save</button>
        <button id="bs-run">Run</button>
        <label class="hint"><input type="checkbox" id="bs-dryrun" checked> dryrun</label>
    </div>
    <!-- Plain textarea on purpose: no CDN editor. The pack has to render on a
         headless box over an SSH tunnel with nothing installed, which is the
         same reason Starwright is a TUI. -->
    <textarea id="bs-text" spellcheck="false"
              placeholder="# paste or write a recipe"></textarea>
    <div id="bs-out"></div>
    <div id="bs-help" class="empty"></div>
</section>
